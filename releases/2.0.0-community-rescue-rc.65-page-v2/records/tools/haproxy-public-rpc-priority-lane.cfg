global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 65s
    timeout server 65s

frontend blockdag_rpc_public
    bind 0.0.0.0:18544
    maxconn 128
    acl rpc_http_method method POST OPTIONS
    option dontlog-normal
    option http-buffer-request
    stick-table type ip size 100k expire 10m store http_req_rate(10s)
    http-request track-sc0 req.hdr_ip(X-Forwarded-For,-1) if { req.hdr(X-Forwarded-For) -m found }
    http-request set-header X-Forwarded-For %[req.hdr_ip(X-Forwarded-For,-1)] if { req.hdr(X-Forwarded-For) -m found }
    acl rpc_client_rate_exceeded sc_http_req_rate(0) gt 100
    acl rpc_expensive req.body -m reg -i '"method"[[:space:]]*:[[:space:]]*"(eth_getBlockByNumber|eth_getBlockByHash|eth_getTransactionByHash|eth_getTransactionReceipt|eth_getLogs|eth_call|eth_estimateGas|eth_getCode|eth_getBalance|debug_[A-Za-z0-9_]+|trace_[A-Za-z0-9_]+)"'
    acl rpc_expensive_lane_full be_conn(blockdag_rpc_node) ge 24
    acl rpc_backend_at_capacity be_conn(blockdag_rpc_node) ge 40
    http-request deny deny_status 429 if rpc_client_rate_exceeded
    http-request deny deny_status 429 if rpc_expensive rpc_expensive_lane_full
    http-request deny deny_status 429 if rpc_backend_at_capacity
    http-request deny deny_status 405 unless rpc_http_method
    default_backend blockdag_rpc_node

backend blockdag_rpc_node
    timeout server 65s
    timeout check 5s
    timeout queue 10s
    retries 2
    server node 127.0.0.1:18545 check inter 5s fall 3 rise 2 maxconn 40
