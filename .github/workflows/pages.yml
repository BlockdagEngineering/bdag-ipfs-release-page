name: Deploy release page

on:
  push:
    branches:
      - main
      - master
      - jeremy-dev-release
      - jeremy/release/2026-08-15-rc64-canonical-recovery-amd64
      - jeremy/release/2026-08-16-rc65-dual-arch-full-data-ipfs
      - jeremy/release/2026-08-17-rc65-rich-ipfs-page-v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate published release
        run: python3 tests/validate_rc30_release.py --publication-ready
      - name: Validate next release draft
        run: python3 tests/validate_rc32_release.py
      - name: Validate published RC44 release
        run: python3 tests/validate_rc44_release.py --publication-ready
      - name: Validate published RC52 release
        run: python3 tests/validate_rc52_release.py --publication-ready
      - name: Validate published RC58 release
        run: >-
          python3 tests/validate_rc58_release.py
          --publication-ready --historical
      - name: Validate published RC62 release
        run: python3 tests/validate_rc62_release.py --publication-ready --historical
      - name: Validate published RC63 release
        run: python3 tests/validate_rc63_release.py
      - name: Validate published RC64 release
        run: python3 tests/validate_rc64_release.py
      - name: Validate RC65 publication candidate
        run: python3 tests/validate_rc65_release.py
      - name: Install exact IPFS verifier
        env:
          KUBO_SHA512: 054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubo_v0.42.0_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://dist.ipfs.tech/kubo/v0.42.0/kubo_v0.42.0_linux-amd64.tar.gz
          printf '%s  %s\n' "$KUBO_SHA512" "$archive" | sha512sum --check --strict -
          install -d -m 0755 "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" --no-same-owner kubo/ipfs
          install -m 0755 "$RUNNER_TEMP/kubo/ipfs" "$RUNNER_TEMP/bin/ipfs"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          printf 'IPFS_PATH=%s\n' "$RUNNER_TEMP/ipfs-verify-repo" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/ipfs" version | grep -Fx 'ipfs version 0.42.0'
          IPFS_PATH="$RUNNER_TEMP/ipfs-verify-repo" "$RUNNER_TEMP/bin/ipfs" init --empty-repo
      - name: Validate signed RC65 rich page revision
        run: python3 tests/validate_rc65_page_v2.py
      - name: Test generated install commands
        run: >-
          node --test
          tests/release-page.test.mjs
          tests/release-page-rc62.test.mjs
          tests/release-page-rc62-dom.test.mjs
          tests/release-page-rc65-v2.test.mjs
      - name: Stage exact public tree
        run: |
          set -euo pipefail
          test ! -e _site
          install -d -m 0755 _site
          install -m 0644 index.html _site/index.html
          cp -a releases _site/releases
          python3 tests/validate_pages_artifact.py _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
